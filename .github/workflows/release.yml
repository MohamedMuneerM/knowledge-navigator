name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python scripts/build.py --strict
          python scripts/build.py

      - name: Package the offline app
        run: |
          mkdir knowledge-navigator
          cp index.html knowledge_base.js knowledge_base.json README.md LICENSE LICENSE-DATA.md knowledge-navigator/
          zip -r "knowledge-navigator-${GITHUB_REF_NAME}.zip" knowledge-navigator

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "knowledge-navigator-${GITHUB_REF_NAME}.zip" --generate-notes --title "$GITHUB_REF_NAME"
