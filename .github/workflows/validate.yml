name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate data (errors and warnings must be zero)
        run: python scripts/build.py --strict

      - name: No chapter or topic id disappears
        run: python scripts/check_ids.py --base "origin/${{ github.base_ref || 'main' }}"

      - name: Build and check the dashboard script parses
        run: |
          python scripts/build.py
          python -c "import re; s = open('index.html', encoding='utf-8').read(); open('app.js', 'w', encoding='utf-8').write(re.findall(r'<script>(.*?)</script>', s, re.S)[-1])"
          node --check app.js
          node --check knowledge_base.js
