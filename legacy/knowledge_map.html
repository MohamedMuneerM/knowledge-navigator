<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Navigator — Science, Math & Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080e1a;--bg2:#0d1526;--bg3:#121e33;--bg4:#1a2844;
  --border:#1e3055;--border2:#2a4070;
  --text:#c8d8f0;--text2:#7b9cc8;--text3:#4a6a9a;
  --physics:#38bdf8;--math:#fbbf24;--ai:#34d399;--elec:#fb923c;
  --physics-dim:rgba(56,189,248,0.15);--math-dim:rgba(251,191,36,0.15);
  --ai-dim:rgba(52,211,153,0.15);--elec-dim:rgba(251,146,60,0.15);
  --sidebar-w:290px;--detail-w:320px;--header-h:58px;
  --radius:8px;--transition:0.2s ease;
}
html,body{height:100%;overflow:hidden;font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:100}
.logo{display:flex;align-items:center;gap:8px;min-width:190px}
.logo-icon{font-family:'Crimson Pro',serif;font-size:22px;font-weight:600;color:var(--text);letter-spacing:-1px;line-height:1}
.logo-sub{font-size:10px;font-weight:300;color:var(--text3);text-transform:uppercase;letter-spacing:2px}
.logo-divider{width:1px;height:30px;background:var(--border)}

.search-wrap{flex:1;position:relative;max-width:520px}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px 8px 36px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:var(--transition)}
.search-wrap input:focus{border-color:var(--border2);background:var(--bg4)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:14px}
.search-kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}

.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);max-height:480px;overflow-y:auto;display:none;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:200}
.search-results.open{display:block}
.sr-group{padding:8px 0}
.sr-group-label{padding:4px 14px 6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3)}
.sr-item{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;transition:var(--transition)}
.sr-item:hover{background:var(--bg4)}
.sr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sr-name{font-size:13px;color:var(--text);flex:1}
.sr-path{font-size:11px;color:var(--text3);white-space:nowrap}
.sr-empty{padding:20px 14px;text-align:center;color:var(--text3);font-size:13px}
.sr-related-tag{font-size:10px;background:var(--bg4);border:1px solid var(--border2);border-radius:3px;padding:1px 5px;color:var(--text2);flex-shrink:0}

.view-tabs{display:flex;gap:3px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px}
.view-tab{padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);border:none;background:transparent;transition:var(--transition);white-space:nowrap}
.view-tab.active{background:var(--bg4);color:var(--text);border:1px solid var(--border2)}
.view-tab:hover:not(.active){color:var(--text)}

.subject-pills{display:flex;gap:4px;margin-left:4px}
.subj-pill{padding:4px 10px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:500;border:1px solid transparent;transition:var(--transition);white-space:nowrap;opacity:0.5}
.subj-pill.active{opacity:1}
.subj-pill[data-s="physics"]{border-color:var(--physics);color:var(--physics);background:var(--physics-dim)}
.subj-pill[data-s="math"]{border-color:var(--math);color:var(--math);background:var(--math-dim)}
.subj-pill[data-s="ai"]{border-color:var(--ai);color:var(--ai);background:var(--ai-dim)}
.subj-pill[data-s="electronics"]{border-color:var(--elec);color:var(--elec);background:var(--elec-dim)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - var(--header-h));margin-top:var(--header-h)}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-inner{overflow-y:auto;flex:1;padding:8px 0}
.subject-section{margin-bottom:2px}
.subject-header{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-radius:0;transition:var(--transition);user-select:none}
.subject-header:hover{background:var(--bg3)}
.subj-color-bar{width:3px;height:16px;border-radius:2px;flex-shrink:0}
.subj-name{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;flex:1}
.subj-count{font-size:10px;color:var(--text3);margin-right:4px}
.subj-arrow{font-size:10px;color:var(--text3);transition:transform 0.2s}
.subject-section.open .subj-arrow{transform:rotate(90deg)}
.chapter-list{display:none;padding:0 0 4px 0}
.subject-section.open .chapter-list{display:block}
.chapter-item{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 26px;cursor:pointer;transition:var(--transition);border-left:2px solid transparent}
.chapter-item:hover{background:var(--bg3)}
.chapter-item.active{background:var(--bg3)}
.chapter-name{font-size:12px;color:var(--text2);flex:1;line-height:1.3}
.chapter-item.active .chapter-name{color:var(--text)}
.chapter-tag{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.5px}
.topics-sublist{display:none;padding:2px 0}
.chapter-item.expanded + .topics-sublist{display:block}
.topic-item{padding:4px 12px 4px 42px;cursor:pointer;font-size:11px;color:var(--text3);transition:var(--transition);line-height:1.4;display:flex;align-items:center;gap:6px}
.topic-item:hover{color:var(--text);background:var(--bg3)}
.topic-item.active{color:var(--text);background:var(--bg4)}
.topic-item::before{content:'·';color:var(--text3);font-size:14px}

/* MAIN */
.main{flex:1;overflow:hidden;position:relative}
.view-panel{position:absolute;inset:0;overflow:auto;display:none}
.view-panel.active{display:block}

/* BROWSE VIEW */
#browse-view{padding:20px;background:var(--bg)}
.browse-header{margin-bottom:20px}
.browse-title{font-family:'Crimson Pro',serif;font-size:26px;font-weight:300;color:var(--text);margin-bottom:4px}
.browse-subtitle{font-size:12px;color:var(--text3)}
.chapter-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.chapter-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all var(--transition);position:relative;overflow:hidden}
.chapter-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px}
.chapter-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.cc-section{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;color:var(--text3);margin-bottom:4px}
.cc-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:8px;line-height:1.3}
.cc-topics{display:flex;flex-wrap:wrap;gap:4px}
.cc-topic{font-size:10px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:2px 6px;color:var(--text3)}
.cc-more{font-size:10px;color:var(--text3);padding:2px 4px}

/* GRAPH VIEW */
#graph-view{background:var(--bg);overflow:hidden}
#graph-svg{width:100%;height:100%;cursor:grab}
#graph-svg:active{cursor:grabbing}
.node circle{transition:r 0.2s,opacity 0.2s}
.node text{pointer-events:none;user-select:none}
.link{fill:none;transition:stroke-opacity 0.2s}
.graph-tooltip{position:fixed;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;pointer-events:none;display:none;max-width:220px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,0.5)}
.gt-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.gt-sub{font-size:11px;color:var(--text2);margin-bottom:6px}
.gt-conns{font-size:10px;color:var(--text3)}
.graph-legend{position:absolute;bottom:16px;left:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;gap:14px;flex-wrap:wrap}
.gl-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.gl-dot{width:10px;height:10px;border-radius:50%}
.graph-hint{position:absolute;top:12px;right:12px;font-size:11px;color:var(--text3);text-align:right;pointer-events:none}

/* DETAIL PANEL */
.detail-panel{width:var(--detail-w);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transform:translateX(100%);transition:transform 0.25s ease;position:absolute;right:0;top:0;bottom:0;z-index:50}
.detail-panel.open{transform:translateX(0)}
.detail-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.detail-close{float:right;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:11px;color:var(--text2);transition:var(--transition)}
.detail-close:hover{background:var(--bg4);color:var(--text)}
.detail-subject{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:4px}
.detail-name{font-family:'Crimson Pro',serif;font-size:22px;font-weight:400;color:var(--text);line-height:1.2;margin-bottom:2px}
.detail-chapter{font-size:11px;color:var(--text3)}
.detail-body{overflow-y:auto;flex:1;padding:14px 16px}
.detail-section{margin-bottom:16px}
.detail-section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.detail-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.topics-list{display:flex;flex-direction:column;gap:2px}
.d-topic{padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;font-size:12px;color:var(--text2);cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:6px}
.d-topic:hover{background:var(--bg4);border-color:var(--border2);color:var(--text)}
.d-topic::before{content:'›';color:var(--text3)}
.conn-cards{display:flex;flex-direction:column;gap:6px}
.conn-card{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:8px 10px;cursor:pointer;transition:var(--transition)}
.conn-card:hover{border-color:var(--border2);background:var(--bg4)}
.conn-card-subject{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.conn-card-name{font-size:12px;color:var(--text);font-weight:500;margin-bottom:3px}
.conn-card-label{font-size:10px;color:var(--text3);line-height:1.4}

/* SEARCH HIGHLIGHT */
.hl{background:rgba(251,191,36,0.25);color:var(--math);border-radius:2px;padding:0 1px}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{width:240px}
  :root{--detail-w:280px}
  .subject-pills{display:none}
}
@media(max-width:700px){
  .sidebar{display:none}
  :root{--detail-w:100vw;--sidebar-w:0px}
}

/* PULSE ANIMATION FOR SEARCH */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.searching .search-icon{animation:pulse 1s infinite}

/* FADE IN */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chapter-card{animation:fadeIn 0.3s ease both}
.sr-item{animation:fadeIn 0.15s ease both}

/* GRAPH FILTERS */
.graph-controls{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:10}
.gc-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;font-size:11px;color:var(--text2);cursor:pointer;transition:var(--transition);white-space:nowrap}
.gc-btn:hover{background:var(--bg3);border-color:var(--border2);color:var(--text)}
.gc-btn.active{background:var(--bg3);border-color:var(--border2);color:var(--text)}

/* no-results */
.no-results{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:10px;color:var(--text3)}
.no-results .nr-icon{font-size:36px;opacity:0.3}
.no-results p{font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div>
      <div class="logo-icon">∮ knowledge</div>
      <div class="logo-sub">navigator</div>
    </div>
  </div>
  <div class="logo-divider"></div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search topics, concepts, algorithms…" autocomplete="off" spellcheck="false">
    <span class="search-kbd">/ to focus</span>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="view-tabs">
    <button class="view-tab" data-view="browse">Browse</button>
    <button class="view-tab active" data-view="graph">Graph</button>
  </div>

  <div class="subject-pills">
    <button class="subj-pill active" data-s="physics">⚛ Physics</button>
    <button class="subj-pill active" data-s="math">∑ Math</button>
    <button class="subj-pill active" data-s="ai">🧠 AI/ML</button>
    <button class="subj-pill active" data-s="electronics">⚡ Electronics</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-inner" id="sidebarTree"></div>
  </aside>

  <main class="main" id="mainArea">
    <!-- Browse View -->
    <div id="browse-view" class="view-panel">
      <div id="browseContent" style="padding:20px">
        <div class="browse-header">
          <div class="browse-title" id="browseTitle">All Chapters</div>
          <div class="browse-subtitle" id="browseSubtitle">Click any chapter card to explore topics</div>
        </div>
        <div class="chapter-cards" id="chapterCards"></div>
      </div>
    </div>

    <!-- Graph View -->
    <div id="graph-view" class="view-panel active">
      <svg id="graph-svg"></svg>
      <div class="graph-controls" id="graphControls"></div>
      <div class="graph-legend">
        <div class="gl-item"><div class="gl-dot" style="background:var(--physics)"></div>Physics</div>
        <div class="gl-item"><div class="gl-dot" style="background:var(--math)"></div>Mathematics</div>
        <div class="gl-item"><div class="gl-dot" style="background:var(--ai)"></div>AI / ML</div>
        <div class="gl-item"><div class="gl-dot" style="background:var(--elec)"></div>Electronics & IoT</div>
      </div>
      <div class="graph-hint">Drag to pan · Scroll to zoom<br>Click node for details · Hover for connections</div>
    </div>
  </main>

  <!-- Detail Panel -->
  <aside class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <button class="detail-close" id="detailClose">✕ Close</button>
      <div class="detail-subject" id="detailSubject"></div>
      <div class="detail-name" id="detailName"></div>
      <div class="detail-chapter" id="detailChapter"></div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </aside>
</div>

<div class="graph-tooltip" id="graphTooltip"></div>

<script>

// DATA

function tokenize(s) {
  return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(t=>t.length>1);
}

function scoreMatch(query, candidate) {
  const q = query.toLowerCase().trim();
  const c = candidate.toLowerCase().trim();
  if(c === q) return 100;
  if(c.startsWith(q)) return 80;
  if(c.includes(q)) return 60;
  const qt = tokenize(q);
  const ct = tokenize(c);
  let score = 0;
  qt.forEach(tok => {
    if(ct.some(x => x.startsWith(tok))) score += 20;
    else if(ct.some(x => x.includes(tok))) score += 10;
  });
  return score;
}

function doSearch(query) {
  if(!query || query.length < 2) return null;
  const results = {direct:[], chapters:[], related:[]};

  SUBJECTS.forEach(s => {
    s.chapters.forEach(ch => {
      const chScore = scoreMatch(query, ch.name);
      if(chScore > 0) {
        results.chapters.push({
          type:'chapter', chapter:ch, subject:s, score:chScore,
          topicCount: ch.topics.length
        });
      }
      ch.topics.forEach(topic => {
        const tScore = scoreMatch(query, topic);
        if(tScore > 0) {
          results.direct.push({
            type:'topic', topic, chapter:ch, subject:s, score:tScore
          });
        }
      });
    });
  });

  // Related: from connected chapters of matched chapters
  const matchedChapterIds = new Set([
    ...results.chapters.map(r=>r.chapter.id),
    ...results.direct.map(r=>r.chapter.id)
  ]);
  matchedChapterIds.forEach(chId => {
    const conns = adjMap[chId] || [];
    conns.forEach(conn => {
      if(!matchedChapterIds.has(conn.id) && chapterMap[conn.id]) {
        const ch = chapterMap[conn.id];
        const s = subjectMap[ch.subjectId];
        results.related.push({
          type:'related', chapter:ch, subject:s,
          connLabel: conn.label, fromChapterId: chId,
          score: 30
        });
      }
    });
  });

  results.direct.sort((a,b)=>b.score-a.score);
  results.chapters.sort((a,b)=>b.score-a.score);
  // dedupe related
  const seenRelated = new Set();
  results.related = results.related.filter(r => {
    if(seenRelated.has(r.chapter.id)) return false;
    seenRelated.add(r.chapter.id);
    return true;
  });

  return {
    direct: results.direct.slice(0,12),
    chapters: results.chapters.slice(0,6),
    related: results.related.slice(0,8)
  };
}

function renderSearchResults(query) {
  const el = document.getElementById('searchResults');
  if(!query || query.length < 2) { el.classList.remove('open'); return; }
  const res = doSearch(query);
  if(!res) { el.classList.remove('open'); return; }

  const total = res.direct.length + res.chapters.length + res.related.length;
  if(total === 0) {
    el.innerHTML = `<div class="sr-empty">No results for "<strong>${esc(query)}</strong>"</div>`;
    el.classList.add('open');
    return;
  }

  let html = '';

  if(res.chapters.length) {
    html += `<div class="sr-group"><div class="sr-group-label">📂 Chapters</div>`;
    res.chapters.forEach(r => {
      html += `<div class="sr-item" onclick="selectChapter('${r.chapter.id}',true)">
        <div class="sr-dot" style="background:${r.subject.hex}"></div>
        <div class="sr-name">${highlightMatch(r.chapter.name, query)}</div>
        <div class="sr-path">${r.subject.name} › ${r.chapter.section}</div>
      </div>`;
    });
    html += '</div>';
  }

  if(res.direct.length) {
    html += `<div class="sr-group"><div class="sr-group-label">◈ Topics</div>`;
    res.direct.forEach(r => {
      html += `<div class="sr-item" onclick="selectTopic('${r.chapter.id}','${esc(r.topic)}',true)">
        <div class="sr-dot" style="background:${r.subject.hex}"></div>
        <div class="sr-name">${highlightMatch(r.topic, query)}</div>
        <div class="sr-path">${r.chapter.name}</div>
      </div>`;
    });
    html += '</div>';
  }

  if(res.related.length) {
    html += `<div class="sr-group"><div class="sr-group-label">↗ Related Areas</div>`;
    res.related.forEach(r => {
      html += `<div class="sr-item" onclick="selectChapter('${r.chapter.id}',true)">
        <div class="sr-dot" style="background:${r.subject.hex}"></div>
        <div class="sr-name">${esc(r.chapter.name)}</div>
        <div class="sr-path">${r.subject.name}</div>
        <span class="sr-related-tag">related</span>
      </div>`;
    });
    html += '</div>';
  }

  el.innerHTML = html;
  el.classList.add('open');
}

function highlightMatch(text, query) {
  if(!query) return esc(text);
  const escaped = esc(text);
  const q = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return escaped.replace(new RegExp(`(${q})`, 'gi'), '<span class="hl">$1</span>');
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderBrowse() {
  const el = document.getElementById('chapterCards');
  const titleEl = document.getElementById('browseTitle');
  const subtitleEl = document.getElementById('browseSubtitle');

  let chapters = [];
  SUBJECTS.forEach(s => {
    if(state.activeSubjects.has(s.id)) {
      s.chapters.forEach(ch => chapters.push({ch, s}));
    }
  });

  titleEl.textContent = state.selectedChapterId
    ? (chapterMap[state.selectedChapterId]?.name || 'All Chapters')
    : 'All Chapters';
  subtitleEl.textContent = `${chapters.length} chapters · Click to explore topics`;

  el.innerHTML = chapters.map(({ch, s}, i) => {
    const topicsPreview = ch.topics.slice(0,6);
    const extra = ch.topics.length - topicsPreview.length;
    const isActive = state.selectedChapterId === ch.id;
    return `<div class="chapter-card ${isActive?'selected':''}" 
      style="animation-delay:${i*0.03}s;${isActive?`border-color:${s.hex};box-shadow:0 0 16px ${s.hex}33`:''}"
      onclick="selectChapter('${ch.id}')">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${s.hex};border-radius:2px 0 0 2px"></div>
      <div class="cc-section">${s.name} › ${ch.section}</div>
      <div class="cc-name">${ch.name}</div>
      <div class="cc-topics">
        ${topicsPreview.map(t=>`<span class="cc-topic">${t}</span>`).join('')}
        ${extra > 0 ? `<span class="cc-more">+${extra} more</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function selectChapter(chId, closeSearch=false) {
  if(closeSearch) {
    document.getElementById('searchResults').classList.remove('open');
    document.getElementById('searchInput').value = '';
  }
  state.selectedChapterId = chId;
  state.selectedTopicName = null;
  showDetailPanel(chId, null);
  renderSidebar();
  if(state.view === 'browse') renderBrowse();
  if(state.view === 'graph') highlightGraphNode(chId);
}

function selectTopic(chId, topicName, closeSearch=false) {
  if(closeSearch) {
    document.getElementById('searchResults').classList.remove('open');
    document.getElementById('searchInput').value = '';
  }
  state.selectedChapterId = chId;
  state.selectedTopicName = topicName;
  showDetailPanel(chId, topicName);
  renderSidebar();
  if(state.view === 'graph') highlightGraphNode(chId);
}

  document.getElementById('detailSubject').innerHTML = `<span style="color:${s.hex}">${s.icon} ${s.name}</span>`;
  document.getElementById('detailName').textContent = topicName || ch.name;
  document.getElementById('detailChapter').textContent = topicName ? `in ${ch.name}` : ch.section;

  const connections = adjMap[chId] || [];
  let bodyHtml = '';

  if(!topicName) {
    // Chapter detail
    bodyHtml += `<div class="detail-section">
      <div class="detail-section-title">Topics (${ch.topics.length})</div>
      <div class="topics-list">
        ${ch.topics.map(t=>`<div class="d-topic" onclick="selectTopic('${chId}','${esc(t)}')">${t}</div>`).join('')}
      </div>
    </div>`;
  } else {
    // Topic detail - find related topics in same chapter
    const related = ch.topics.filter(t => t !== topicName).slice(0,8);
    bodyHtml += `<div class="detail-section">
      <div class="detail-section-title">Chapter: ${ch.name}</div>
      <div class="topics-list">
        <div class="d-topic" style="border-left:3px solid ${s.hex};padding-left:8px;color:var(--text)">${topicName}</div>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">More in this chapter</div>
      <div class="topics-list">
        ${related.map(t=>`<div class="d-topic" onclick="selectTopic('${chId}','${esc(t)}')">${t}</div>`).join('')}
      </div>
    </div>`;
  }

  if(connections.length) {
    bodyHtml += `<div class="detail-section">
      <div class="detail-section-title">Connected Fields (${connections.length})</div>
      <div class="conn-cards">`;
    connections.forEach(conn => {
      const tch = chapterMap[conn.id];
      if(!tch) return;
      const ts = subjectMap[tch.subjectId];
      bodyHtml += `<div class="conn-card" onclick="selectChapter('${conn.id}')">
        <div class="conn-card-subject" style="color:${ts.hex}">${ts.icon} ${ts.name}</div>
        <div class="conn-card-name">${tch.name}</div>
        <div class="conn-card-label">${conn.label}</div>
      </div>`;
    });
    bodyHtml += `</div></div>`;
  }

  document.getElementById('detailBody').innerHTML = bodyHtml;
  document.getElementById('detailPanel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  state.selectedChapterId = null;
  state.selectedTopicName = null;
  renderSidebar();
  if(state.view === 'graph') resetGraphHighlight();
}

// ============================================================
// D3 GRAPH
// ============================================================
let simulation, svg, linkGroup, nodeGroup, zoomBehavior;
let graphNodes = [], graphLinks = [];
let highlightedNode = null;

function initGraph() {
  const container = document.getElementById('graph-view');
  const svgEl = document.getElementById('graph-svg');
  const W = container.clientWidth;
  const H = container.clientHeight;

  svg = d3.select('#graph-svg')
    .attr('width', W)
    .attr('height', H);

  // Define arrow marker (unused now, but good to have)
  svg.append('defs').append('marker')
    .attr('id','arrow').attr('viewBox','0 -4 8 8').attr('refX',20).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-4L8,0L0,4').attr('fill','rgba(255,255,255,0.1)');

  const g = svg.append('g').attr('id','graph-g');
  linkGroup = g.append('g').attr('id','links');
  nodeGroup = g.append('g').attr('id','nodes');

  zoomBehavior = d3.zoom()
    .scaleExtent([0.15, 4])
    .on('zoom', e => g.attr('transform', e.transform));

  svg.call(zoomBehavior);
  svg.on('click', e => {
    if(e.target === svgEl) closeDetail();
  });

  buildGraphData();
  renderGraph();
  buildGraphControls();
}

function buildGraphData() {
  graphNodes = [];
  graphLinks = [];
  const nodeIds = new Set();

  SUBJECTS.forEach(s => {
    if(!state.activeSubjects.has(s.id)) return;
    s.chapters.forEach(ch => {
      graphNodes.push({
        id: ch.id, name: ch.name, subjectId: s.id, hex: s.hex,
        section: ch.section, topicCount: ch.topics.length,
        r: Math.max(10, Math.min(22, 8 + ch.topics.length * 0.5))
      });
      nodeIds.add(ch.id);
    });
  });

  CONNECTIONS.forEach(c => {
    if(nodeIds.has(c.f) && nodeIds.has(c.t)) {
      graphLinks.push({ source: c.f, target: c.t, label: c.l });
    }
  });
}

function renderGraph() {
  const container = document.getElementById('graph-view');
  const W = container.clientWidth || 800;
  const H = container.clientHeight || 600;

  // Color by subject
  const colorMap = { physics: '#38bdf8', math: '#fbbf24', ai: '#34d399', electronics: '#fb923c' };

  simulation = d3.forceSimulation(graphNodes)
    .force('link', d3.forceLink(graphLinks).id(d=>d.id).distance(d=>{
      // shorter distance for same-subject connections
      const src = chapterMap[typeof d.source === 'string' ? d.source : d.source.id];
      const tgt = chapterMap[typeof d.target === 'string' ? d.target : d.target.id];
      return src?.subjectId === tgt?.subjectId ? 80 : 160;
    }).strength(0.3))
    .force('charge', d3.forceManyBody().strength(-280))
    .force('center', d3.forceCenter(W/2, H/2).strength(0.05))
    .force('collide', d3.forceCollide(d => d.r + 18).strength(0.8))
    .force('x', d3.forceX(d => {
      const map = { physics: W*0.25, math: W*0.75, ai: W*0.75, electronics: W*0.25 };
      return map[d.subjectId] || W/2;
    }).strength(0.03))
    .force('y', d3.forceY(d => {
      const map = { physics: H*0.35, math: H*0.35, ai: H*0.65, electronics: H*0.65 };
      return map[d.subjectId] || H/2;
    }).strength(0.03));

  // Links
  const link = linkGroup.selectAll('.link').data(graphLinks, d=>`${d.source.id||d.source}-${d.target.id||d.target}`);
  link.exit().remove();
  const linkEnter = link.enter().append('line').attr('class','link');
  const allLinks = linkEnter.merge(link)
    .attr('stroke', d => {
      const srcSub = chapterMap[d.source.id || d.source]?.subjectId;
      const tgtSub = chapterMap[d.target.id || d.target]?.subjectId;
      if(srcSub === tgtSub) return colorMap[srcSub] || '#4a6a9a';
      return '#2a4070';
    })
    .attr('stroke-width', d => {
      const srcSub = chapterMap[d.source.id || d.source]?.subjectId;
      const tgtSub = chapterMap[d.target.id || d.target]?.subjectId;
      return srcSub === tgtSub ? 1.5 : 0.8;
    })
    .attr('stroke-opacity', d => {
      const srcSub = chapterMap[d.source.id || d.source]?.subjectId;
      const tgtSub = chapterMap[d.target.id || d.target]?.subjectId;
      return srcSub === tgtSub ? 0.25 : 0.15;
    });

  // Nodes
  const tooltip = document.getElementById('graphTooltip');
  const nodeGroup2 = nodeGroup.selectAll('.node').data(graphNodes, d=>d.id);
  nodeGroup2.exit().remove();
  const nodeEnter = nodeGroup2.enter().append('g').attr('class','node')
    .call(d3.drag()
      .on('start', (e,d)=>{ if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on('end', (e,d)=>{ if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

  nodeEnter.append('circle')
    .attr('r', d=>d.r)
    .attr('fill', d=>`${d.hex}22`)
    .attr('stroke', d=>d.hex)
    .attr('stroke-width', 1.5);

  // Glow filter
  const defs = svg.select('defs');
  const filter = defs.append('filter').attr('id','glow');
  filter.append('feGaussianBlur').attr('stdDeviation','3').attr('result','coloredBlur');
  const feMerge = filter.append('feMerge');
  feMerge.append('feMergeNode').attr('in','coloredBlur');
  feMerge.append('feMergeNode').attr('in','SourceGraphic');

  nodeEnter.append('text')
    .attr('text-anchor','middle')
    .attr('dy','0.35em')
    .attr('font-size', d => d.r > 16 ? '8.5px' : '7.5px')
    .attr('font-family','IBM Plex Sans, sans-serif')
    .attr('font-weight','500')
    .attr('fill', d=>d.hex)
    .attr('opacity', 0.9)
    .attr('pointer-events','none')
    .each(function(d) {
      const words = d.name.split(' ');
      const line1 = words.slice(0, Math.ceil(words.length/2)).join(' ');
      const line2 = words.slice(Math.ceil(words.length/2)).join(' ');
      if(words.length > 2 && d.r > 13) {
        d3.select(this).append('tspan').attr('x',0).attr('dy','-0.55em').text(line1);
        d3.select(this).append('tspan').attr('x',0).attr('dy','1.1em').text(line2);
      } else {
        d3.select(this).text(d.name.length > 14 ? d.name.substring(0,12)+'…' : d.name);
      }
    });

  const allNodes = nodeEnter.merge(nodeGroup2);
  allNodes.select('circle')
    .attr('r', d=>d.r)
    .attr('fill', d=>`${d.hex}22`)
    .attr('stroke', d=>d.hex)
    .attr('stroke-width', 1.5);

  allNodes.style('cursor','pointer')
    .on('click', (e, d) => {
      e.stopPropagation();
      selectChapter(d.id);
      highlightGraphNode(d.id);
    })
    .on('mouseenter', (e, d) => {
      // Show tooltip
      const conns = adjMap[d.id] || [];
      tooltip.innerHTML = `<div class="gt-title">${d.name}</div>
        <div class="gt-sub" style="color:${d.hex}">${subjectMap[d.subjectId]?.name} › ${d.section}</div>
        <div class="gt-conns">${d.topicCount} topics · ${conns.length} connections</div>`;
      tooltip.style.display = 'block';
      // Highlight connected nodes
      const connSet = new Set(conns.map(c=>c.id));
      connSet.add(d.id);
      nodeGroup.selectAll('.node circle').attr('opacity', n => connSet.has(n.id) ? 1 : 0.2);
      nodeGroup.selectAll('.node text').attr('opacity', n => connSet.has(n.id) ? 1 : 0.1);
      linkGroup.selectAll('.link')
        .attr('stroke-opacity', l => {
          const srcId = l.source.id || l.source;
          const tgtId = l.target.id || l.target;
          if(srcId === d.id || tgtId === d.id) return 0.8;
          return 0.03;
        })
        .attr('stroke-width', l => {
          const srcId = l.source.id || l.source;
          const tgtId = l.target.id || l.target;
          return (srcId === d.id || tgtId === d.id) ? 2 : 0.5;
        });
    })
    .on('mousemove', e => {
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    })
    .on('mouseleave', () => {
      tooltip.style.display = 'none';
      if(!state.selectedChapterId) resetGraphHighlight();
    });

  simulation.on('tick', () => {
    linkGroup.selectAll('.link')
      .attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
      .attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
    nodeGroup.selectAll('.node')
      .attr('transform', d=>`translate(${d.x},${d.y})`);
  });
}

function highlightGraphNode(chId) {
  highlightedNode = chId;
  const conns = adjMap[chId] || [];
  const connSet = new Set(conns.map(c=>c.id));
  connSet.add(chId);

  nodeGroup.selectAll('.node circle')
    .attr('opacity', d => connSet.has(d.id) ? 1 : 0.2)
    .attr('r', d => d.id === chId ? d.r * 1.4 : d.r)
    .attr('stroke-width', d => d.id === chId ? 3 : 1.5)
    .attr('filter', d => d.id === chId ? 'url(#glow)' : null);

  nodeGroup.selectAll('.node text').attr('opacity', d => connSet.has(d.id) ? 1 : 0.1);

  linkGroup.selectAll('.link')
    .attr('stroke-opacity', l => {
      const s = l.source.id || l.source;
      const t = l.target.id || l.target;
      return (s === chId || t === chId) ? 0.8 : 0.03;
    })
    .attr('stroke-width', l => {
      const s = l.source.id || l.source;
      const t = l.target.id || l.target;
      return (s === chId || t === chId) ? 2 : 0.5;
    });
}

function resetGraphHighlight() {
  highlightedNode = null;
  nodeGroup.selectAll('.node circle')
    .attr('opacity', 1).attr('r', d=>d.r).attr('stroke-width', 1.5).attr('filter', null);
  nodeGroup.selectAll('.node text').attr('opacity', 0.9);
  linkGroup.selectAll('.link')
    .attr('stroke-opacity', d => {
      const srcSub = chapterMap[d.source.id || d.source]?.subjectId;
      const tgtSub = chapterMap[d.target.id || d.target]?.subjectId;
      return srcSub === tgtSub ? 0.25 : 0.15;
    })
    .attr('stroke-width', d => {
      const srcSub = chapterMap[d.source.id || d.source]?.subjectId;
      const tgtSub = chapterMap[d.target.id || d.target]?.subjectId;
      return srcSub === tgtSub ? 1.5 : 0.8;
    });
}

function buildGraphControls() {
  const el = document.getElementById('graphControls');
  el.innerHTML = `
    <button class="gc-btn" onclick="resetZoom()" title="Reset view">⌂ Reset View</button>
    <button class="gc-btn" onclick="reheat()" title="Reheat simulation">↺ Relayout</button>
  `;
}

function resetZoom() {
  const container = document.getElementById('graph-view');
  svg.transition().duration(500).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(container.clientWidth/2, container.clientHeight/2).scale(0.7).translate(-container.clientWidth/2, -container.clientHeight/2)
  );
}

function reheat() {
  simulation.alphaTarget(0.5).restart();
  setTimeout(() => simulation.alphaTarget(0), 3000);
}

function updateGraph() {
  buildGraphData();
  linkGroup.selectAll('.link').remove();
  nodeGroup.selectAll('.node').remove();
  simulation.stop();
  renderGraph();
}

// ============================================================
// VIEW SWITCHING
// ============================================================
function switchView(view) {
  state.view = view;
  document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view-panel').forEach(p => p.classList.toggle('active', p.id === view+'-view'));
  if(view === 'browse') renderBrowse();
}

// ============================================================
// SUBJECT FILTER
// ============================================================
function toggleSubject(subjId) {
  const pill = document.querySelector(`.subj-pill[data-s="${subjId}"]`);
  if(state.activeSubjects.has(subjId)) {
    if(state.activeSubjects.size > 1) {
      state.activeSubjects.delete(subjId);
      pill.classList.remove('active');
    }
  } else {
    state.activeSubjects.add(subjId);
    pill.classList.add('active');
  }
  updateGraph();
  if(state.view === 'browse') renderBrowse();
}

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById('searchInput').addEventListener('input', e => {
  state.searchQuery = e.target.value;
  renderSearchResults(state.searchQuery);
});

document.getElementById('searchInput').addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    document.getElementById('searchResults').classList.remove('open');
    document.getElementById('searchInput').value = '';
    state.searchQuery = '';
  }
});

document.addEventListener('click', e => {
  if(!e.target.closest('.search-wrap')) {
    document.getElementById('searchResults').classList.remove('open');
  }
});

document.addEventListener('keydown', e => {
  if(e.key === '/' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
    document.getElementById('searchInput').select();
  }
  if(e.key === 'Escape') {
    closeDetail();
    document.getElementById('searchResults').classList.remove('open');
  }
});

document.querySelectorAll('.view-tab').forEach(b => {
  b.addEventListener('click', () => switchView(b.dataset.view));
});

document.querySelectorAll('.subj-pill').forEach(pill => {
  pill.addEventListener('click', () => toggleSubject(pill.dataset.s));
});

document.getElementById('detailClose').addEventListener('click', closeDetail);

// ============================================================
// INIT
// ============================================================
window.addEventListener('load', () => {
  renderSidebar();
  renderBrowse();
  // Small delay to ensure container has dimensions
  setTimeout(initGraph, 100);
});

window.addEventListener('resize', () => {
  if(!svg) return;
  const container = document.getElementById('graph-view');
  svg.attr('width', container.clientWidth).attr('height', container.clientHeight);
  if(simulation) {
    simulation.force('center', d3.forceCenter(container.clientWidth/2, container.clientHeight/2).strength(0.05));
    simulation.alpha(0.3).restart();
  }
});
</script>
</body>
</html>
